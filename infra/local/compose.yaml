name: think-meet
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: think_meet_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/bootstrap.py first}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped
  minio:
    build: ./minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: think_meet_root
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/bootstrap.py first}
    volumes:
      - minio_data:/data
    networks: [app]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped
  api:
    build: ../../server
    env_file: .env
    restart: unless-stopped
    init: true
    networks: [app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      livekit:
        condition: service_started
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    networks: [app]
    restart: unless-stopped
  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    environment:
      LAN_IP: ${LAN_IP}
      PROXY_AUTH_SECRET: ${PROXY_AUTH_SECRET}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTPS_PORT:-443}:443"
    networks: [app]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
networks:
  app:
volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
