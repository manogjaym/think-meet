name: think-meet
services:
  api:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    networks: [app, postgres, storage]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      livekit:
        condition: service_started
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ../infra/local/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    networks: [app]
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      LAN_IP: ${LAN_IP}
      PROXY_AUTH_SECRET: ${PROXY_AUTH_SECRET}
    volumes:
      - ../infra/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTPS_PORT:-443}:443"
    networks: [app]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
networks:
  app:
  postgres:
    external: true
    name: postgre-container_default
  storage:
    external: true
    name: minio_default
volumes:
  caddy_data:
  caddy_config:
